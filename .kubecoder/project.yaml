# Curated automation for the Gitblit MCP Support Plugin.
# Schema: https://kubecoder.home/help/reference/project-yaml/
#
# This repo has no .kubecoder/config.yaml and needs none: it is worked on as a
# sibling of the Gitblit MCP server, whose config.yaml clones it, selects the
# `java` toolchain it builds in and the `aac-tools` one its lint runs in, and runs `cd /work/GitblitMCPSupportPlugin &&
# kc project setup` at pod start. This file is the whole KubeCoder footprint.
#
# `kc project` is cwd-bound, so run every verb from this repo's root.

projects:
  root:
    description: >-
      Gitblit MCP Support Plugin — a Java/Maven Gitblit plugin serving the
      /api/.mcp-internal REST API that the Gitblit MCP server adapts to MCP.
    # The image build (registry:5000/gitblit-initializer).
    # AaC/GitblitMCPSupportPlugin is this repo's second Jenkins job: the
    # architecture-as-code producer that runs Jenkinsfile.architecture.
    jenkins: Gitblit/GitblitMCPSupportPlugin
    # Gitblit 1.10.0 is in no public Maven repository, so its JAR ships in lib/
    # and is seeded into the local repository before the build can resolve it —
    # the same step the Dockerfile runs. Re-running it is idempotent.
    setup: cexec java mvn install:install-file -Dfile=lib/gitblit-1.10.0.jar -DpomFile=lib/gitblit-1.10.0.pom -q
    build: cexec java mvn clean package -DskipTests
    # tests/ is a pytest suite that drives this plugin's REST API over HTTP
    # against a running Gitblit with the plugin deployed. The script unpacks a
    # throwaway Gitblit 1.10.0 under /work/scratch/local-gitblit, seeds it with
    # this environment's three checkouts, installs the zip the first statement
    # builds, starts it in `java` on port 8089, waits for the first Lucene
    # index pass (about a minute) and runs the suite against it: some 3 to 5
    # minutes in all. The build is repeated here so the suite never runs
    # against a stale zip; `clean` removes it first, so a failed build fails
    # the script rather than testing the last good one. CI still builds with
    # -DskipTests, and src/ carries no Java tests of its own.
    test:
      - cexec java mvn clean package -DskipTests -q
      - scripts/local-gitblit-test.sh
    # The container image is not wired into `build:`. Jenkins builds it
    # with helmCharts.kaniko2 from this repo's root; from here the equivalent is
    # `kaniko --context . --no-push`, which is a minute of Maven inside the
    # builder on top of the build the verb already ran.
    lint:
      # The architecture-as-code artifact, validated exactly as
      # Jenkinsfile.architecture validates it. This is a POST to
      # architecture.webathome.org, so it needs outbound HTTPS and it can fail
      # for transport reasons: exit 2 is the service being unreachable or 5xx,
      # exit 1 is the artifact genuinely being invalid.
      - cexec aac-tools arch-validate docs/architecture/*.yaml
